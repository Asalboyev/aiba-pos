# GitLab CI — hozircha shared runnerlar Linux only (Docker).
# Windows/macOS build lokal PowerShell/hdiutil skripti bilan qilinadi
# (aiba-pos/build-scripts/ papkasida).
#
# Android APK'ni Linux runner o'zi build qilib beradi.

stages:
  - build

variables:
  FLUTTER_VERSION: "3.35.5"

build-android:
  stage: build
  image: ghcr.io/cirruslabs/flutter:$FLUTTER_VERSION
  script:
    - cd pos-terminal
    - flutter pub get
    - flutter build apk --release
    - cp build/app/outputs/flutter-apk/app-release.apk ../AIBA-POS-Android.apk
  artifacts:
    name: "aiba-pos-android-$CI_COMMIT_SHORT_SHA"
    paths:
      - AIBA-POS-Android.apk
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual   # Har push'da avto ishlamasin — kerak bo'lganda "Play" bosasiz
      allow_failure: true
