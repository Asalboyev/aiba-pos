# GitLab CI — hozircha shared runnerlar Linux only (Docker).
# Windows/macOS build lokal PowerShell/hdiutil skripti bilan qilinadi
# (aiba-pos/build-scripts/ papkasida).
#
# Android APK'ni Linux runner o'zi build qilib beradi.

stages:
  - build
  - deploy

variables:
  FLUTTER_VERSION: "3.35.5"

build-android:
  stage: build
  image: ghcr.io/cirruslabs/flutter:$FLUTTER_VERSION
  script:
    - cd pos-terminal
    - flutter pub get
    - flutter build apk --release
    - cp build/app/outputs/flutter-apk/app-release.apk ../AIBA-POS-Android.apk
  artifacts:
    name: "aiba-pos-android-$CI_COMMIT_SHORT_SHA"
    paths:
      - AIBA-POS-Android.apk
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual   # Har push'da avto ishlamasin — kerak bo'lganda "Play" bosasiz
      allow_failure: true

# Деплой POS-бэкенда на uic-cloud (10.0.0.35), домен pos.milligrill.aiba.uz.
# Runner: shell-executor на самом сервере (tag: pos-deploy), job выполняется
# от пользователя hamrayev. Секреты живут в /home/hamrayev/deploy/milli-grill-pos.env
# и в репозиторий не попадают.
deploy-pos:
  stage: deploy
  tags:
    - pos-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  resource_group: pos-deploy
  script:
    - rsync -a --delete --exclude '.env' pos/ /home/hamrayev/apps/milli-grill-pos/pos/
    - cp /home/hamrayev/deploy/milli-grill-pos.env /home/hamrayev/apps/milli-grill-pos/pos/.env
    - cd /home/hamrayev/apps/milli-grill-pos/pos
    - docker compose up -d --build
    - docker compose ps
    - curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:8006/health
    - docker image prune -f
  environment:
    name: production
    url: http://pos.milligrill.aiba.uz
