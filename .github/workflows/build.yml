# GitHub Actions — AIBA POS Windows + macOS uchun tayyor installer yasaydi.
# Har push (yoki qo'lda "Run workflow") — ZIP/DMG artefaktlar bilan bo'ladi.

name: Build POS Terminal

on:
  push:
    branches: [main]
  workflow_dispatch:   # Qo'lda ishga tushirish uchun

jobs:
  # ============================================================
  # Windows uchun EXE + ZIP paket
  # ============================================================
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
        working-directory: pos-terminal

      - name: Get dependencies
        run: flutter pub get
        working-directory: pos-terminal

      - name: Build Windows release
        run: flutter build windows --release
        working-directory: pos-terminal

      # VC++ runtime DLL'lari Release papkaga qo'shiladi — aks holda toza
      # kompyuterda "VCRUNTIME140.dll topilmadi" xatosi bilan ochilmaydi.
      - name: Bundle VC++ runtime DLLs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $crt = & $vswhere -latest -find 'VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT' | Select-Object -Last 1
          if (-not $crt) { Write-Error "VC CRT redist topilmadi"; exit 1 }
          Write-Host "CRT: $crt"
          Copy-Item "$crt\msvcp140.dll","$crt\vcruntime140.dll","$crt\vcruntime140_1.dll" `
            -Destination "pos-terminal/build/windows/x64/runner/Release/" -Force

      # O'rnatuvchi (Setup.exe) — kassir uchun: ikki marta bosadi, ilova
      # LocalAppData'ga o'rnatiladi (UAC/admin so'ralmaydi), ish stolida
      # yorliq, xohlasa avto-start. Inno Setup runner'da o'rnatilgan.
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = "1.0.$env:GITHUB_RUN_NUMBER"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$ver `
            /O"$env:GITHUB_WORKSPACE" pos-terminal\windows\installer.iss

      - name: Zip release (portable)
        run: |
          cd pos-terminal/build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath $env:GITHUB_WORKSPACE/AIBA-POS-Windows.zip

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AIBA-POS-Setup
          path: AIBA-POS-Setup.exe
          retention-days: 30

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIBA-POS-Windows
          path: AIBA-POS-Windows.zip
          retention-days: 30

  # ============================================================
  # macOS uchun DMG (siz'da allaqachon .app bor, lekin CI'da ham qulay)
  # ============================================================
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
        working-directory: pos-terminal

      - name: Get dependencies
        run: flutter pub get
        working-directory: pos-terminal

      - name: Build macOS release
        run: flutter build macos --release
        working-directory: pos-terminal

      - name: Package DMG
        run: |
          APP=$(ls -d pos-terminal/build/macos/Build/Products/Release/*.app | head -1)
          echo "app: $APP"
          # Ad-hoc imzo — imzosiz app Apple Silicon'da "damaged" qattiq blokini
          # beradi; ad-hoc imzo uni yumshoq "unidentified developer" (o'ng tugma
          # -> Open bilan ochiladigan) holatga o'tkazadi.
          codesign --force --deep --sign - "$APP" || true
          mkdir dmg-src
          cp -R "$APP" dmg-src/
          ln -s /Applications dmg-src/Applications
          # Bosiladigan o'rnatuvchi — ilovani Applications'ga ko'chiradi,
          # Gatekeeper belgisini olib tashlaydi va ochadi. Foydalanuvchi
          # faqat 2 marta bosadi (ochish + terminal ruxsati).
          cat > "dmg-src/AIBA POS ni ornatish.command" <<'CMD'
          #!/bin/bash
          set -e
          SRC="$(cd "$(dirname "$0")" && pwd)/AIBA POS.app"
          DST="/Applications/AIBA POS.app"
          echo "AIBA POS o'rnatilmoqda..."
          rm -rf "$DST" 2>/dev/null || true
          cp -R "$SRC" "$DST"
          xattr -cr "$DST" 2>/dev/null || true
          codesign --force --deep --sign - "$DST" 2>/dev/null || true
          open "$DST"
          echo "Tayyor! AIBA POS ochildi. Bu oynani yopsangiz bo'ladi."
          CMD
          chmod +x "dmg-src/AIBA POS ni ornatish.command"
          # Zaxira yo'riqnoma (skript ishlamasa qo'lda)
          cat > "dmg-src/OQING - o'rnatish.txt" <<'TXT'
          AIBA POS — o'rnatish (macOS)

          ODDIY YO'L:
            "AIBA POS ni ornatish.command" ustiga IKKI marta bosing.
            (Birinchi marta "Open" tasdig'ini so'rasa — Open bosing.)
            Ilova o'zi Applications'ga o'rnatiladi va ochiladi.

          AGAR ".command" ochilmasa:
            Uning ustiga O'NG tugma -> Open -> Open.

          QO'LDA (agar yuqoridagilar ishlamasa):
            1) "AIBA POS" ni Applications papkasiga sudrang.
            2) Terminal oching, quyidagini yozing (nusxa oling):
               xattr -cr "/Applications/AIBA POS.app"
            3) Applications'da "AIBA POS" ni oching.
          TXT
          hdiutil create -volname "AIBA POS" -srcfolder dmg-src -ov -format UDZO AIBA-POS-macOS.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIBA-POS-macOS
          path: AIBA-POS-macOS.dmg
          retention-days: 30
