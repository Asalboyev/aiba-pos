# GitHub Actions — AIBA POS Windows + macOS uchun tayyor installer yasaydi.
# Har push (yoki qo'lda "Run workflow") — ZIP/DMG artefaktlar bilan bo'ladi.

name: Build POS Terminal

on:
  push:
    branches: [main]
  workflow_dispatch:   # Qo'lda ishga tushirish uchun

jobs:
  # ============================================================
  # Windows uchun EXE + ZIP paket
  # ============================================================
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
        working-directory: pos-terminal

      - name: Get dependencies
        run: flutter pub get
        working-directory: pos-terminal

      - name: Build Windows release
        run: flutter build windows --release
        working-directory: pos-terminal

      - name: Zip release
        run: |
          cd pos-terminal/build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath $env:GITHUB_WORKSPACE/AIBA-POS-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIBA-POS-Windows
          path: AIBA-POS-Windows.zip
          retention-days: 30

  # ============================================================
  # macOS uchun DMG (siz'da allaqachon .app bor, lekin CI'da ham qulay)
  # ============================================================
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
        working-directory: pos-terminal

      - name: Get dependencies
        run: flutter pub get
        working-directory: pos-terminal

      - name: Build macOS release
        run: flutter build macos --release
        working-directory: pos-terminal

      - name: Package DMG
        run: |
          APP=$(ls -d pos-terminal/build/macos/Build/Products/Release/*.app | head -1)
          echo "app: $APP"
          # Ad-hoc imzo — imzosiz app Apple Silicon'da "damaged" qattiq blokini
          # beradi; ad-hoc imzo uni yumshoq "unidentified developer" (o'ng tugma
          # -> Open bilan ochiladigan) holatga o'tkazadi.
          codesign --force --deep --sign - "$APP" || true
          mkdir dmg-src
          cp -R "$APP" dmg-src/
          ln -s /Applications dmg-src/Applications
          # Qisqa o'rnatish yo'riqnomasi
          cat > "dmg-src/OQING - o'rnatish.txt" <<'TXT'
          AIBA POS — o'rnatish (macOS)

          1) "AIBA POS" ilovasini yonidagi Applications papkasiga sudrab tashlang.
          2) Applications ichida "AIBA POS" ustiga O'NG tugma bosib -> "Open".
          3) Chiqadigan oynada yana "Open" bosing. Bir marta shunday qilinsa,
             keyingi safar oddiy ochiladi.

          (Ilova Apple sertifikati bilan imzolanmagani uchun macOS birinchi marta
           ogohlantiradi — bu normal, yuqoridagi qadam bilan hal bo'ladi.)
          TXT
          hdiutil create -volname "AIBA POS" -srcfolder dmg-src -ov -format UDZO AIBA-POS-macOS.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIBA-POS-macOS
          path: AIBA-POS-macOS.dmg
          retention-days: 30
